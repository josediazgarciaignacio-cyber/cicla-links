  <style>
    :root {
      --verde-bosque: #408038;
      --verde-bosque-2: #356b2f;
      --verde-lima: #b0c860;
      --verde-lima-2: #9bb84d;
      --amarillo: #f8e858;
      --tinta: #1f2a1d;
      --tinta-suave: #5a6b54;
      --fondo: #f4f7ec;
      --tarjeta: #ffffff;
      --borde: rgba(64, 128, 56, 0.14);
      --sombra: 0 18px 50px -18px rgba(53, 107, 47, 0.45);
      --radio: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--tinta);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(176, 200, 96, 0.35), transparent 60%),
        radial-gradient(900px 500px at 90% 110%, rgba(248, 232, 88, 0.28), transparent 55%),
        var(--fondo);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 28px;
      box-shadow: var(--sombra);
      padding: 40px 28px 28px;
      text-align: center;
      animation: subir 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    @keyframes subir {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      display: block;
      animation: girar-in 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    @keyframes girar-in {
      from { opacity: 0; transform: rotate(-90deg) scale(0.7); }
      to   { opacity: 1; transform: rotate(0) scale(1); }
    }

    h1 {
      font-size: 1.7rem;
      letter-spacing: -0.5px;
      font-weight: 800;
      color: var(--tinta);
    }
    h1 .tres-d { color: var(--verde-bosque); }

    .tagline {
      margin: 8px auto 4px;
      max-width: 300px;
      font-size: 0.97rem;
      line-height: 1.45;
      color: var(--tinta-suave);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 5px 12px;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--verde-bosque-2);
      background: rgba(176, 200, 96, 0.22);
      border-radius: 999px;
    }
    .badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--verde-bosque);
    }

    .links {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      font-size: 1.02rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: var(--radio);
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      will-change: transform;
    }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 3px solid var(--amarillo); outline-offset: 2px; }

    .btn-primario {
      background: var(--verde-bosque);
      color: #fff;
      box-shadow: 0 10px 22px -10px rgba(64, 128, 56, 0.7);
    }
    .btn-primario:hover {
      background: var(--verde-bosque-2);
      transform: translateY(-2px);
      box-shadow: 0 16px 28px -12px rgba(64, 128, 56, 0.75);
    }

    .btn-secundario {
      background: #fff;
      color: var(--verde-bosque-2);
      border-color: var(--verde-lima);
    }
    .btn-secundario:hover {
      background: rgba(176, 200, 96, 0.16);
      border-color: var(--verde-lima-2);
      transform: translateY(-2px);
    }

    .btn svg { width: 19px; height: 19px; flex-shrink: 0; }
    .btn .arrow { margin-left: auto; opacity: 0.55; transition: transform 0.2s ease; }
    .btn:hover .arrow { transform: translateX(3px); opacity: 0.9; }

    .creds {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--borde);
    }
    .creds-label {
      font-size: 0.68rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--tinta-suave);
      opacity: 0.8;
    }
    .creds-list {
      margin-top: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--tinta-suave);
      line-height: 1.5;
    }

    .foot {
      margin-top: 18px;
      font-size: 0.75rem;
      color: var(--tinta-suave);
      opacity: 0.75;
    }
    .foot strong { color: var(--verde-bosque); }

    @media (max-width: 360px) {
      .card { padding: 32px 20px 22px; }
      h1 { font-size: 1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .logo { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>
